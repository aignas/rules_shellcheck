---
name: CI

on:  # yamllint disable rule:truthy
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Test fetch
        run: bazel fetch //...

      - name: Test
        run: bazel test //...

      # The examples double as integration tests of the rules as consumed
      # from another module. They are run in place here so that every
      # platform in the matrix covers them, including Windows where the
      # release archive is not produced.
      - name: Test example (check_glob)
        run: bazel test //...
        working-directory: examples/check_glob

      - name: Test example (optional_attributes)
        run: bazel test //...
        working-directory: examples/optional_attributes

      - name: Create release archive and notes
        # Packaging shells out to Unix tools; see //internal/pkg.
        if: runner.os != 'Windows'
        # Set by GH actions, see
        # https://docs.github.com/en/actions/learn-github-actions/environment-variables#default-environment-variables
        run: ./ci/package.sh "${{ github.ref_name }}"

  pkg:
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release archive and notes
        # Set by GH actions, see
        # https://docs.github.com/en/actions/learn-github-actions/environment-variables#default-environment-variables
        run: ./ci/package.sh "${{ github.ref_name }}"

      - name: Archive release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/*
          retention-days: 5
